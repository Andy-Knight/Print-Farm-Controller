name: Lockfile bootstrap (temporary)

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - name: Upgrade npm
        run: npm install --global npm@12.2.0
      - name: Resolve reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --min-release-age=7
      - name: Output generated lockfile for review
        run: |
          echo 'PFC_LOCKFILE_JSON_BEGIN'
          node -e "console.log(JSON.stringify(require('./package-lock.json')))"
          echo 'PFC_LOCKFILE_JSON_END'
