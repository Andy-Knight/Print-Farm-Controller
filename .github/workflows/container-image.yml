name: Controller CI and Container Release

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .npmrc
      - .github/dependabot.yml
      - src/**
      - public/**
      - ui/**
      - scripts/**
      - emulator/**
      - test/**
      - .github/workflows/container-image.yml
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - .npmrc
      - .github/dependabot.yml
      - src/**
      - public/**
      - ui/**
      - scripts/**
      - emulator/**
      - test/**
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andy-knight/print-farm-controller

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Upgrade npm to approved version
        run: npm install --global npm@12.2.0 --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run regression suite
        run: npm test

      - name: Summarise regression test inventory
        run: npm run test:audit

      - name: Set up Go for pinned MinIO
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.8'
          cache: false

      - name: Build pinned MinIO S3 test service
        run: go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z

      - name: Start MinIO S3 test service
        run: |
          mkdir -p "$RUNNER_TEMP/pfc-minio-data"
          MINIO_ROOT_USER=pfcadmin \
          MINIO_ROOT_PASSWORD=pfc-test-secret \
            "$HOME/go/bin/minio" server "$RUNNER_TEMP/pfc-minio-data" \
              --address 127.0.0.1:9000 \
              --console-address 127.0.0.1:9001 \
              > "$RUNNER_TEMP/pfc-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/pfc-minio.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pfc-minio.log"
          exit 1

      - name: Run MinIO S3 integration test
        env:
          PFC_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          PFC_TEST_S3_BUCKET: pfc-backups
          PFC_TEST_S3_REGION: us-east-1
          PFC_TEST_S3_ACCESS_KEY: pfcadmin
          PFC_TEST_S3_SECRET_KEY: pfc-test-secret
        run: node --test test/s3-minio-integration.test.js

      - name: Show MinIO logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pfc-minio.log" || true

      - name: Stop MinIO S3 test service
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pfc-minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pfc-minio.pid")" || true
          fi

  browser:
    name: Chromium Preact regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Upgrade npm to approved version
        run: npm install --global npm@12.2.0 --no-audit --no-fund

      - name: Install locked frontend and browser tools
        run: npm ci --include=dev --no-audit --no-fund

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run real-browser Preact regression
        env:
          PFC_VISUAL_CAPTURE_DIR: test-artifacts/visual-regression
        run: npm run test:browser

      - name: Preserve visual theme previews
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pfc-design-system-previews
          path: test-artifacts/visual-regression/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Preserve browser screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pfc-browser-failure
          path: test-artifacts/
          if-no-files-found: ignore

  windows:
    name: Windows SEA compatibility
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up patched Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          architecture: x64

      - name: Upgrade npm to approved version
        run: npm install --global npm@12.2.0 --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build Windows SEA executable
        run: npm run build:sea:windows

      - name: Check portable executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/windows-x64/PrintFarmController.exe')) {
            throw 'The Windows SEA build did not produce its executable.'
          }

  smoke:
    name: Container smoke test
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoke-test image
        run: |
          printf '%s' 'smoke-client.apps.googleusercontent.com' > "$RUNNER_TEMP/pfc-google-client-id"
          printf '%s' 'smoke-client-secret' > "$RUNNER_TEMP/pfc-google-client-secret"
          printf '%s' '00000000-0000-4000-8000-000000000036' > "$RUNNER_TEMP/pfc-microsoft-client-id"
          docker build \
            --secret id=pfc_google_client_id,src="$RUNNER_TEMP/pfc-google-client-id" \
            --secret id=pfc_google_client_secret,src="$RUNNER_TEMP/pfc-google-client-secret" \
            --secret id=pfc_microsoft_client_id,src="$RUNNER_TEMP/pfc-microsoft-client-id" \
            -t print-farm-controller:smoke .

      - name: Start smoke-test container
        run: |
          docker run -d --name pfc-smoke -p 4242:4242 print-farm-controller:smoke

      - name: Verify controller responds and bundled OAuth is active
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4242/ > /dev/null; then
              google_status="$(curl --fail --silent http://127.0.0.1:4242/api/integrations/google-drive/status)"
              onedrive_status="$(curl --fail --silent http://127.0.0.1:4242/api/integrations/one-drive/status)"
              node -e "
                const google = JSON.parse(process.argv[1]).googleDrive;
                const oneDrive = JSON.parse(process.argv[2]).oneDrive;
                if (!google?.configured || !google?.builtInConfigured || google?.configurationSource !== 'built-in') {
                  console.error('Bundled Google OAuth configuration was not active in the smoke-test image');
                  process.exit(1);
                }
                if (google?.customConfigured || google?.clientId || google?.clientSecretConfigured) {
                  console.error('Built-in Google OAuth credentials leaked into custom configuration status');
                  process.exit(1);
                }
                if (!oneDrive?.configured || !oneDrive?.builtInConfigured || oneDrive?.configurationSource !== 'built-in') {
                  console.error('Bundled Microsoft OAuth configuration was not active in the smoke-test image');
                  process.exit(1);
                }
                if (oneDrive?.customConfigured || oneDrive?.clientId) {
                  console.error('Built-in Microsoft OAuth client ID leaked into custom configuration status');
                  process.exit(1);
                }
              " "$google_status" "$onedrive_status"
              exit 0
            fi
            sleep 1
          done
          docker logs pfc-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs pfc-smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f pfc-smoke || true

  build:
    name: Release or manually verify multi-architecture image
    permissions:
      contents: read
      packages: write
    # Pull requests already build a disposable image in the smoke job.
    # Skip costly amd64+arm64 release builds on every feature-branch commit.
    # A completed feature branch can opt in to one manual, non-published build
    # via Actions > Run workflow > select branch.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    needs: [smoke, browser, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build manually selected feature branch (not published)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PFC_BUNDLE_BUILD_NONCE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish production image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PFC_BUNDLE_BUILD_NONCE=${{ github.run_id }}
          secrets: |
            pfc_google_client_id=${{ secrets.PFC_GOOGLE_CLIENT_ID }}
            pfc_google_client_secret=${{ secrets.PFC_GOOGLE_CLIENT_SECRET }}
            pfc_microsoft_client_id=${{ secrets.PFC_MICROSOFT_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
