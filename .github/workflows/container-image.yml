name: Container Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - src/**
      - public/**
      - emulator/**
      - test/**
      - .github/workflows/container-image.yml
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - src/**
      - public/**
      - emulator/**
      - test/**
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andy-knight/print-farm-controller

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run regression suite
        run: npm test

      - name: Start MinIO S3 test service
        run: |
          docker network create pfc-s3-test
          docker run -d \
            --name pfc-minio \
            --network pfc-s3-test \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=pfcadmin \
            -e MINIO_ROOT_PASSWORD=pfc-test-secret \
            quay.io/minio/minio server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pfc-minio
          exit 1

      - name: Create MinIO test bucket
        run: |
          docker run --rm \
            --network pfc-s3-test \
            --entrypoint /bin/sh \
            quay.io/minio/mc \
            -c "mc alias set local http://pfc-minio:9000 pfcadmin pfc-test-secret && mc mb local/pfc-backups"

      - name: Run MinIO S3 integration test
        env:
          PFC_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          PFC_TEST_S3_BUCKET: pfc-backups
          PFC_TEST_S3_REGION: us-east-1
          PFC_TEST_S3_ACCESS_KEY: pfcadmin
          PFC_TEST_S3_SECRET_KEY: pfc-test-secret
        run: node --test test/s3-minio-integration.test.js

      - name: Stop MinIO S3 test service
        if: always()
        run: |
          docker rm -f pfc-minio || true
          docker network rm pfc-s3-test || true

  smoke:
    name: Container smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoke-test image
        run: |
          printf '%s' 'smoke-client.apps.googleusercontent.com' > "$RUNNER_TEMP/pfc-google-client-id"
          printf '%s' 'smoke-client-secret' > "$RUNNER_TEMP/pfc-google-client-secret"
          docker build \
            --secret id=pfc_google_client_id,src="$RUNNER_TEMP/pfc-google-client-id" \
            --secret id=pfc_google_client_secret,src="$RUNNER_TEMP/pfc-google-client-secret" \
            -t print-farm-controller:smoke .

      - name: Start smoke-test container
        run: |
          docker run -d --name pfc-smoke -p 4242:4242 print-farm-controller:smoke

      - name: Verify controller responds and bundled OAuth is active
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4242/ > /dev/null; then
              status="$(curl --fail --silent http://127.0.0.1:4242/api/integrations/google-drive/status)"
              node -e "
                const status = JSON.parse(process.argv[1]).googleDrive;
                if (!status?.configured || !status?.builtInConfigured || status?.configurationSource !== 'built-in') {
                  console.error('Bundled Google OAuth configuration was not active in the smoke-test image');
                  process.exit(1);
                }
                if (status?.customConfigured || status?.clientId || status?.clientSecretConfigured) {
                  console.error('Built-in Google OAuth credentials leaked into custom configuration status');
                  process.exit(1);
                }
              " "$status"
              exit 0
            fi
            sleep 1
          done
          docker logs pfc-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs pfc-smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f pfc-smoke || true

  build:
    name: Build and publish multi-architecture image
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PFC_BUNDLE_BUILD_NONCE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PFC_BUNDLE_BUILD_NONCE=${{ github.run_id }}
          secrets: |
            pfc_google_client_id=${{ secrets.PFC_GOOGLE_CLIENT_ID }}
            pfc_google_client_secret=${{ secrets.PFC_GOOGLE_CLIENT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
