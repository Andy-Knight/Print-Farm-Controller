name: Container Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - src/**
      - public/**
      - emulator/**
      - .github/workflows/container-image.yml
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - src/**
      - public/**
      - emulator/**
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andy-knight/print-farm-controller

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression suite
        run: npm test

  smoke:
    name: Container smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoke-test image
        run: docker build -t print-farm-controller:smoke .

      - name: Start smoke-test container
        run: |
          docker run -d --name pfc-smoke -p 4242:4242 print-farm-controller:smoke

      - name: Verify controller responds
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4242/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pfc-smoke
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs pfc-smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f pfc-smoke || true

  build:
    name: Build and publish multi-architecture image
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PFC_BUNDLE_BUILD_NONCE=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Build and publish production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PFC_BUNDLE_BUILD_NONCE=${{ github.run_id }}
          secrets: |
            pfc_google_client_id=${{ secrets.PFC_GOOGLE_CLIENT_ID }}
            pfc_google_client_secret=${{ secrets.PFC_GOOGLE_CLIENT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
