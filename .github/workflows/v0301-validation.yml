name: v0.30.1 validation

on:
  push:
    branches:
      - feature/dashboard-circular-filament-swatches-v0301
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build bundle
        run: npm run build:bundle
