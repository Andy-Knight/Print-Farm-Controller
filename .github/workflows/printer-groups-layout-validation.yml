name: Temporary printer groups layout validation
on:
  push:
    branches:
      - feature/printer-groups-v0250
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm test
      - run: npm run build:bundle
